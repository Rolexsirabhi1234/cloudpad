<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CloudPad</title>
<style>
:root{--bg:#0B0708;--panel:#151011;--panel2:#201819;--edge:#3A2B2D;--text:#F6EFEF;--dim:#A8979A;--cyan:#E03A4B;--mag:#B9A66B;--lime:#B9C86A;--amber:#D8A15A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;font-family:"Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;touch-action:none}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;touch-action:none;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* top bars */
.bar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:8px;padding:0 8px;background:linear-gradient(#0B0708,rgba(11,7,8,.88));border-bottom:1px solid var(--edge);z-index:5}
.ib{width:36px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--edge);display:grid;place-items:center}
.ib svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:#2C2122}
#title{font-weight:700;font-size:17px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;min-width:50px}
.pill{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;background:var(--panel);border:1px solid var(--edge);font-weight:700;font-size:13px;max-width:46vw}
.pill i{width:9px;height:9px;border-radius:50%;flex:none}
.pill b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.seg{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--edge);height:34px;background:var(--panel)}
.seg button{padding:0 14px;font-weight:800;font-size:13px;letter-spacing:.6px;color:var(--dim)}
.seg button.on{background:var(--cyan);color:#FFF4F4}
.tbtn{height:34px;padding:0 13px;border-radius:10px;background:var(--panel2);border:1px solid var(--edge);font-weight:800;font-size:13px;letter-spacing:.4px}
.tbtn.pri{background:var(--cyan);color:#FFF4F4;border-color:var(--cyan)}
.tbtn.warn{color:var(--amber)}
.tbtn:disabled{opacity:.35}
#ebar{overflow-x:auto;scrollbar-width:none}#ebar::-webkit-scrollbar{display:none}#ebar .tbtn{padding:0 10px;flex:none}
#ebar .nm{font-weight:800;font-size:15px;color:var(--cyan);white-space:nowrap}
#ebar .ht{font-size:11px;color:var(--dim);white-space:nowrap}
#ebar .col{display:flex;flex-direction:column;line-height:1.15;min-width:0}

/* gear menu */
.menu{position:absolute;right:8px;top:50px;min-width:210px;background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:6px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;font-weight:700;font-size:15px}
.menu button:active{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--edge);margin:4px 2px}

/* bind picker */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:12}
.sheet{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:14px;width:min(560px,92vw)}
.sheet h3{margin:0 0 10px;font-size:16px;color:var(--cyan)}
#bindGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#bindGrid button{padding:10px 4px;border-radius:10px;background:var(--panel2);border:1px solid var(--edge);font-weight:700;font-size:13px}
#bindGrid button.on{background:var(--cyan);color:#FFF4F4;border-color:var(--cyan)}
.sheet .row{display:flex;justify-content:flex-end;margin-top:12px}

/* home */
#home{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));
  background:radial-gradient(900px 400px at 15% -10%,rgba(224,58,75,.10),transparent 60%),radial-gradient(800px 400px at 100% 110%,rgba(185,166,107,.10),transparent 60%),var(--bg)}
.hh{display:flex;align-items:center;gap:12px;min-height:48px}
.logo{font-weight:900;font-size:26px;letter-spacing:5px;font-weight:800}
.logo span{color:var(--cyan)}
.hsub{font-size:13px;color:var(--dim)}
.hint{font-size:13px;color:var(--dim);margin:6px 2px 8px}
#cards{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-content:center;min-height:0}
.card{display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;gap:6px;padding:12px;border-radius:18px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--edge);text-align:left;min-height:0;position:relative;overflow:hidden}
.card:active{transform:scale(.98);border-color:var(--cyan)}
.card.last{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset,0 0 22px rgba(224,58,75,.22)}
.card .art{flex:1;display:grid;place-items:center;min-height:0}
.card .art svg{width:100%;max-height:100%;max-width:140px}
.card .nm{font-weight:900;font-size:19px;letter-spacing:.4px}
.card .sb{font-size:12px;color:var(--dim)}
@media (max-aspect-ratio:1/1){#cards{grid-template-columns:repeat(2,1fr)}.card{min-height:120px}}
#hDetail{font-size:12px;color:var(--dim);margin:6px 2px 0;min-height:15px}

#toast{position:absolute;left:50%;top:56px;transform:translate(-50%,-14px);background:#1A1617;border:1px solid var(--cyan);color:var(--text);padding:9px 16px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:20;max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- polish layer ---- */
.bar{background:linear-gradient(180deg,rgba(22,17,18,.96),rgba(12,8,9,.86));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(190,150,150,.18);box-shadow:0 6px 18px rgba(0,0,0,.45)}
.ib{background:linear-gradient(180deg,#2B2021,#191314);box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 2px 6px rgba(0,0,0,.4)}
#title{background:linear-gradient(90deg,var(--cyan),#FFC9CE);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 8px rgba(224,58,75,.35))}
.pill{background:linear-gradient(180deg,#1C1516,#120C0D);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.seg{box-shadow:0 2px 8px rgba(0,0,0,.4)}
.seg button.on{background:linear-gradient(180deg,#FF8A94,#A3182B);box-shadow:0 0 14px rgba(224,58,75,.45)}
.tbtn{background:linear-gradient(180deg,#2B2021,#191314);box-shadow:0 1px 0 rgba(255,255,255,.07) inset}
.tbtn.pri{background:linear-gradient(180deg,#FF8A94,#A3182B);box-shadow:0 0 14px rgba(224,58,75,.4)}
.menu,.sheet{background:linear-gradient(180deg,#1C1516,#120C0D);border-color:rgba(190,150,150,.25);box-shadow:0 18px 50px rgba(0,0,0,.7)}
.menu{animation:pop .16s ease-out;transform-origin:top right}
.sheet{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
#bindGrid button{background:linear-gradient(180deg,#2B2021,#191314)}
#toast{background:linear-gradient(180deg,#1C1516,#120C0D);box-shadow:0 0 22px rgba(224,58,75,.25)}

/* home */
.logo{font-size:30px;letter-spacing:2px;filter:drop-shadow(0 0 14px rgba(224,58,75,.35))}
.logo span{background:linear-gradient(90deg,#E03A4B,#B9A66B);-webkit-background-clip:text;background-clip:text;color:transparent}
.hint{opacity:.85}
.card{--ac:var(--cyan);background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 60%),linear-gradient(165deg,#2A2627,#1A1617);border:1px solid rgba(190,150,150,.22);box-shadow:0 14px 28px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.08) inset;animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms);transition:transform .12s,border-color .12s,box-shadow .12s}
.card::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--ac);opacity:.9;box-shadow:0 0 16px var(--ac)}

.card[data-id=xbox]{--ac:#3DDC84}.card[data-id=ps5]{--ac:#4DA3FF}.card[data-id=shooter]{--ac:#FF4D5E}.card[data-id=racing]{--ac:#FFD23F}.card[data-id=f1]{--ac:#FF2E9A}
.card:active{transform:scale(.97);border-color:var(--ac)}
.card.last{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset,0 0 26px color-mix(in srgb,var(--ac) 35%,transparent),0 14px 28px rgba(0,0,0,.45)}
.card .art svg{filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.card .nm{text-shadow:0 2px 8px rgba(0,0,0,.5)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card,.menu,.sheet{animation:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="bar" class="bar hidden">
    <button class="ib" id="bHome" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
    <div id="title">Xbox</div>
    <div class="pill" id="pill"><i></i><b>Waiting</b></div>
    <div class="grow"></div>
    <div class="seg hidden" id="seg"><button data-m="gyro">TILT</button><button data-m="wheel">WHEEL</button></div>
    <button class="ib" id="bEdit" aria-label="Edit layout"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg></button>
    <button class="ib" id="bGear" aria-label="Settings menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></button>
  </div>

  <div id="ebar" class="bar hidden">
    <div class="col"><span class="nm" id="eName"></span><span class="ht" id="eHint"></span></div>
    <div class="grow"></div>
    <button class="tbtn" id="eSm">−</button><button class="tbtn" id="eBig">+</button>
    <button class="tbtn" id="eHide">Hide</button>
    <button class="tbtn" id="eBind">Button</button>
    <button class="tbtn" id="eOp">Opacity</button>
    <button class="tbtn warn" id="eReset">Reset</button>
    <button class="tbtn" id="eCancel">Cancel</button>
    <button class="tbtn pri" id="eDone">Done</button>
  </div>

  <div id="menu" class="menu hidden">
    <button id="mEdit">Edit layout</button>
    <button id="mSteer">Switch tilt / wheel steering</button>
    <button id="mCenter">Re-centre tilt</button>
    <button id="mOpacity">Control opacity</button>
    <button id="mReset">Reset this layout</button>
    <hr>
    <button id="mHome">Choose another layout</button>
    <button id="mSettings">CloudPad settings</button>
  </div>

  <div id="bindlist" class="modal hidden"><div class="sheet"><h3>This control presses…</h3><div id="bindGrid"></div><div class="row"><button class="tbtn" id="bindClose">Close</button></div></div></div>

  <div id="home">
    <div class="hh">
      <div class="logo">CLOUD<span>PAD</span></div>
      <div class="hsub" id="hLast"></div>
      <div class="grow"></div>
      <div class="pill" id="hPill"><i></i><b>Waiting</b></div>
      <button class="ib" id="hSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg></button>
    </div>
    <div class="hint">Choose how you want to play. You can move, resize and re-map every button with the pencil once you are in.</div>
    <div id="cards"></div>
    <div id="hDetail"></div>
  </div>

  <div id="toast"></div>
</div>
<script src="core.js"></script>
<script src="layouts.js"></script>
<script src="draw.js"></script>
<script src="app.js"></script>
</body>
</html>
